<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — Trace Mind</title><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/brand-assets.css"></head>
<body class="auth-page"><a class="auth-back" href="/">← Back to Trace Mind</a><main class="auth-shell"><a class="brand auth-brand" href="/"><span class="brand-mark"><img src="/static/tracemind-logo.png" alt="Trace Mind logo"></span><span>Trace<span class="brand-light"> Mind</span></span></a><div class="auth-card"><div class="eyebrow">YOUR INVESTIGATION WORKSPACE</div><h1>Welcome back</h1><p class="muted">Sign in to pick up where your team left off.</p><form id="auth-form" data-endpoint="/api/auth/login"><label>Email address<input name="email" type="email" autocomplete="email" placeholder="you@company.com" required></label><label>Password<input name="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" required minlength="8"></label><p class="form-error" id="form-error" role="alert"></p><button class="button button-primary button-wide" type="submit">Sign in <span>→</span></button></form><p class="auth-switch">New to Trace Mind? <a href="/signup">Create an account</a></p><div class="auth-local-note"><span>◇</span> Your workspace data is stored locally on this machine.</div></div></main><script src="/static/auth.js"></script></body>
