<style>

function dlCSV(){const q=v=>{v=String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};dl(`timeline-${S.inv.id}.csv`,"text/csv",["id,timestamp,type,severity,service,message,source_ref",...S.inv.events.map(e=>[e.id,e.ts,e.type,e.severity,e.service,e.message,e.ref].map(q).join(","))].join("\n"))}
V.settings=()=>{const a=S.ai||{};
return `<div class="grid g2e"><div class="card"><h2>AI connection</h2><table><tr><th>Status</th><td>${a.configured?chip("API key configured","g"):chip("No API key - deterministic mode","a")}</td></tr><tr><th>Model ID</th><td class="mono">${esc(a.model||"-")}</td></tr></table><p class="lead">The key is read on the server from the <code>OPENROUTER_API_KEY</code> environment variable (model: <code>OPENROUTER_MODEL</code>) and is never shown or sent to the browser. Check model availability and pricing at openrouter.ai/models; a model is not necessarily free.</p><button class="btn sm" onclick="testAI()">Test connection</button><div id="aitest" style="margin-top:10px" role="status"></div></div>
<div class="card"><h2>Analysis settings</h2><div class="row"><label>Change window (min)<br><input type="number" min="1" max="1440" value="${S.cfg.window_min}" onchange="S.cfg.window_min=Math.max(1,+this.value||30)"></label><label>Minimum score<br><input type="number" step=".05" min="0" max="1" value="${S.cfg.min_score}" onchange="S.cfg.min_score=Math.min(1,Math.max(0,+this.value||0))"></label></div><p class="lead">A deploy/config change only counts as a candidate if it happened within the window before the first warning or error. If the best score is below the minimum, TraceMind reports insufficient evidence.</p></div>
<div class="card"><h2>Data sources</h2><ul><li>Built-in sample incidents: simulated, with ground-truth labels for evaluation</li><li>Uploads: .log, .txt, .csv (max 2 MB), parsed on the server</li><li>Service topology: sample topology unless dependency data is supplied</li></ul></div>
<div class="card"><h2>What needs credentials</h2><ul><li><b>No key needed:</b> upload, parsing, timeline, correlation, ranking, reports, 3D map, evaluation</li><li><b>Key needed:</b> the optional "Run AI analysis" step. Evidence is redacted (tokens, passwords, emails) before it leaves the server.</li></ul></div></div>`};
async function testAI(){const el=$("#aitest");el.innerHTML=spin("Testing...");try{const r=await api("/api/ai/test",{method:"POST"});el.innerHTML=r.ok?chip("Connection works","g"):`<div class="err" role="alert">${esc(r.message)}</div>`}catch(e){el.innerHTML=`<div class="err" role="alert">${esc(e.message)}</div>`}}
/* ---------- App shell ---------- */
const AFTER={map:initMap};
function render(focusTitle){const p=(location.hash||"#overview").slice(1);S.page=PAGES.some(x=>x[0]===p)?p:"overview";const pg=PAGES.find(x=>x[0]===S.page);
$("#nav").innerHTML=PAGES.map(x=>`<button type="button" class="${x[0]===S.page?"on":""}" ${x[0]===S.page?'aria-current="page"':""} data-go="${x[0]}">${ico(x[2])}${x[1]}</button>`).join("");$("#title").textContent=pg[1];$("#lead").textContent=pg[3];document.title=pg[1]+" - TraceMind";
$("#banner").innerHTML=S.loadErr?`<div class="err" role="alert">${esc(S.loadErr)} <button class="btn sec sm" onclick="boot()">Retry</button></div>`:"";
$("#page").innerHTML=S.booted?V[S.page]():'<div class="card empty" role="status">'+spin("Loading...")+'</div>';closeDrawer();if(AFTER[S.page])AFTER[S.page]();chips();if(focusTitle===true)$("#title").focus()}
async function loadBase(){S.depsErr="";const r=await Promise.allSettled([api("/api/incidents").then(x=>S.samples=x),api("/api/services/dependencies").then(x=>S.deps=x),api("/api/ai/status").then(x=>S.ai=x)]);const bad=r.find(x=>x.status==="rejected");S.loadErr=bad?bad.reason.message:"";S.booted=true;if(r[1].status==="rejected")S.depsErr=r[1].reason.message}
async function boot(){const loader=$("#boot-loader"),label=$("#boot-loader-percent"),bar=$("#boot-loader-bar"),started=performance.now();let percent=0;const progress=setInterval(()=>{percent=Math.min(92,percent+Math.max(1,(92-percent)*.045));label.textContent=Math.floor(percent)+"%";bar.style.width=percent+"%"},60);await loadBase();render();clearInterval(progress);await new Promise(resolve=>setTimeout(resolve,Math.max(0,900-(performance.now()-started))));label.textContent="100%";bar.style.width="100%";await new Promise(resolve=>setTimeout(resolve,220));$(".app").classList.add("is-ready");loader.classList.add("done");setTimeout(()=>loader.remove(),400)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-ev],[data-svc],[data-inv],[data-go],[data-pick],[data-quick]");if(!t)return;const d=t.dataset;if(d.ev)openEv(d.ev);else if(d.svc)selSvc(d.svc);else if(d.inv)openInv(d.inv);else if(d.go)go(d.go);else if(d.pick)pickSample(d.pick);else if(d.quick)quickRun(d.quick)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();const t=e.target;if((e.key==="Enter"||e.key===" ")&&t.getAttribute&&t.getAttribute("role")==="button"&&t.tagName!=="BUTTON"){e.preventDefault();t.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
addEventListener("hashchange",()=>render(true));
$("#logout").addEventListener("click",async()=>{try{await api("/api/auth/logout",{method:"POST"});location.href="/"}catch(e){$("#banner").innerHTML=errBox(e.message)}});
const loader=document.createElement("div");loader.className="boot-loader";loader.id="boot-loader";loader.setAttribute("role","status");loader.setAttribute("aria-live","polite");loader.innerHTML='<div class="boot-loader-content"><img src="/static/tracemind-logo.png" alt=""><div class="boot-loader-label">Preparing your workspace</div><div class="boot-loader-track"><span id="boot-loader-bar"></span></div><span class="boot-loader-percent" id="boot-loader-percent">0%</span></div>';document.body.appendChild(loader);
const themeButton=document.createElement("button");themeButton.type="button";themeButton.className="btn sec sm theme-toggle";themeButton.id="theme-toggle";themeButton.setAttribute("aria-pressed","true");document.querySelector(".top").appendChild(themeButton);
function setTheme(theme,persist){document.body.dataset.theme=theme;themeButton.textContent=theme==="dark"?"Light theme":"Dark theme";themeButton.setAttribute("aria-pressed",String(theme==="dark"));if(persist){try{localStorage.setItem("tracemind-dashboard-theme",theme)}catch(error){console.warn("Could not save dashboard theme preference.",error)}}}
try{const savedTheme=localStorage.getItem("tracemind-dashboard-theme");if(savedTheme==="light"||savedTheme==="dark")document.body.dataset.theme=savedTheme}catch(error){console.warn("Could not load dashboard theme preference.",error)}
setTheme(document.body.dataset.theme==="light"?"light":"dark",false);
themeButton.addEventListener("click",()=>setTheme(document.body.dataset.theme==="dark"?"light":"dark",true));
render();boot();
</script></body></html>
